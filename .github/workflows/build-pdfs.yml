name: Build PDFs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.typ'
      - '**/*.sty'
      - '**/*.cls'
      - '**/*.bib'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'examples/**'
      - 'fonts/**'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tex_main: ${{ steps.filter.outputs.tex_main }}
      tex_extra: ${{ steps.filter.outputs.tex_extra }}
      tex_tp2: ${{ steps.filter.outputs.tex_tp2 }}
      tex_tp2_extra: ${{ steps.filter.outputs.tex_tp2_extra }}
      tex_tp3: ${{ steps.filter.outputs.tex_tp3 }}
      tex_tp3_extra: ${{ steps.filter.outputs.tex_tp3_extra }}
      typst_main: ${{ steps.filter.outputs.typst_main }}
      typst_extra: ${{ steps.filter.outputs.typst_extra }}
      typst_tp2: ${{ steps.filter.outputs.typst_tp2 }}
      typst_tp2_extra: ${{ steps.filter.outputs.typst_tp2_extra }}
      typst_tp3: ${{ steps.filter.outputs.typst_tp3 }}
      typst_tp3_extra: ${{ steps.filter.outputs.typst_tp3_extra }}
      manual: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect document changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tex_main:
              - 'TP1/Practico1.tex'
              - 'TP1/*.png'
              - 'TP1/*.jpg'
              - 'TP1/*.jpeg'
              - 'examples/tp1/**'
            tex_extra:
              - 'TP1/Practico1-extra.tex'
            tex_tp2:
              - 'TP2/Practico2.tex'
              - 'examples/tp2/**'
            tex_tp2_extra:
              - 'TP2/Practico2-extra.tex'
            tex_tp3:
              - 'TP3/Practico3.tex'
              - 'examples/tp3/**'
            tex_tp3_extra:
              - 'TP3/Practico3-extra.tex'
              - 'examples/tp3-extra/**'
            typst_main:
              - 'TP1-typst/Practico1t.typ'
              - 'TP1/*.png'
              - 'TP1/*.jpg'
              - 'TP1/*.jpeg'
              - 'examples/tp1/**'
              - 'fonts/**'
            typst_extra:
              - 'TP1-typst/Practico1t-extra.typ'
              - 'fonts/**'
            typst_tp2:
              - 'TP2-typst/Practico2t.typ'
              - 'examples/tp2/**'
              - 'fonts/**'
            typst_tp2_extra:
              - 'TP2-typst/Practico2t-extra.typ'
              - 'fonts/**'
            typst_tp3:
              - 'TP3-typst/Practico3t.typ'
              - 'examples/tp3/**'
              - 'fonts/**'
            typst_tp3_extra:
              - 'TP3-typst/Practico3t-extra.typ'
              - 'examples/tp3-extra/**'
              - 'fonts/**'

  build:
    name: LaTeX TP${{ matrix.tp }}${{ matrix.variant }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add one entry for each document that should produce a PDF artifact.
        include:
          - tex_file: TP1/Practico1.tex
            pdf_file: TP1/Practico1.pdf
            artifact_name: tp1-latex
            tp: 1
            variant: ''
            filter: tex_main
          - tex_file: TP1/Practico1-extra.tex
            pdf_file: TP1/Practico1-extra.pdf
            artifact_name: tp1-latex-extra
            tp: 1
            variant: ' extra'
            filter: tex_extra
          - tex_file: TP2/Practico2.tex
            pdf_file: TP2/Practico2.pdf
            artifact_name: tp2-latex
            tp: 2
            variant: ''
            filter: tex_tp2
          - tex_file: TP2/Practico2-extra.tex
            pdf_file: TP2/Practico2-extra.pdf
            artifact_name: tp2-latex-extra
            tp: 2
            variant: ' extra'
            filter: tex_tp2_extra
          - tex_file: TP3/Practico3.tex
            pdf_file: TP3/Practico3.pdf
            artifact_name: tp3-latex
            tp: 3
            variant: ''
            filter: tex_tp3
          - tex_file: TP3/Practico3-extra.tex
            pdf_file: TP3/Practico3-extra.pdf
            artifact_name: tp3-latex-extra
            tp: 3
            variant: ' extra'
            filter: tex_tp3_extra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile ${{ matrix.tex_file }}
        if: needs.changes.outputs.manual == 'true' || needs.changes.outputs[matrix.filter] == 'true'
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: ${{ matrix.tex_file }}
          work_in_root_file_dir: true

      - name: Upload PDF artifact
        if: needs.changes.outputs.manual == 'true' || needs.changes.outputs[matrix.filter] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.pdf_file }}
          if-no-files-found: error

  build-typst:
    name: Typst TP${{ matrix.tp }}${{ matrix.variant }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add one entry for each Typst document that should produce a PDF artifact.
        include:
          - typ_file: TP1-typst/Practico1t.typ
            pdf_file: TP1-typst/Practico1t.pdf
            artifact_name: tp1-typst
            tp: 1
            variant: ''
            filter: typst_main
          - typ_file: TP1-typst/Practico1t-extra.typ
            pdf_file: TP1-typst/Practico1t-extra.pdf
            artifact_name: tp1-typst-extra
            tp: 1
            variant: ' extra'
            filter: typst_extra
          - typ_file: TP2-typst/Practico2t.typ
            pdf_file: TP2-typst/Practico2t.pdf
            artifact_name: tp2-typst
            tp: 2
            variant: ''
            filter: typst_tp2
          - typ_file: TP2-typst/Practico2t-extra.typ
            pdf_file: TP2-typst/Practico2t-extra.pdf
            artifact_name: tp2-typst-extra
            tp: 2
            variant: ' extra'
            filter: typst_tp2_extra
          - typ_file: TP3-typst/Practico3t.typ
            pdf_file: TP3-typst/Practico3t.pdf
            artifact_name: tp3-typst
            tp: 3
            variant: ''
            filter: typst_tp3
          - typ_file: TP3-typst/Practico3t-extra.typ
            pdf_file: TP3-typst/Practico3t-extra.pdf
            artifact_name: tp3-typst-extra
            tp: 3
            variant: ' extra'
            filter: typst_tp3_extra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile ${{ matrix.typ_file }}
        if: needs.changes.outputs.manual == 'true' || needs.changes.outputs[matrix.filter] == 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -w "/work/$(dirname '${{ matrix.typ_file }}')" \
            ghcr.io/typst/typst:latest \
            compile --root /work --font-path /work/fonts \
              "$(basename '${{ matrix.typ_file }}')" \
              "$(basename '${{ matrix.pdf_file }}')"

      - name: Upload Typst PDF artifact
        if: needs.changes.outputs.manual == 'true' || needs.changes.outputs[matrix.filter] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.pdf_file }}
          if-no-files-found: error

  release:
    needs: [changes, build, build-typst]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs['build-typst'].result == 'success' || needs['build-typst'].result == 'skipped') &&
      (needs.changes.outputs.manual == 'true' ||
       needs.changes.outputs.tex_main == 'true' ||
       needs.changes.outputs.tex_extra == 'true' ||
       needs.changes.outputs.tex_tp2 == 'true' ||
       needs.changes.outputs.tex_tp2_extra == 'true' ||
       needs.changes.outputs.tex_tp3 == 'true' ||
       needs.changes.outputs.tex_tp3_extra == 'true' ||
       needs.changes.outputs.typst_main == 'true' ||
       needs.changes.outputs.typst_extra == 'true' ||
       needs.changes.outputs.typst_tp2 == 'true' ||
       needs.changes.outputs.typst_tp2_extra == 'true' ||
       needs.changes.outputs.typst_tp3 == 'true' ||
       needs.changes.outputs.typst_tp3_extra == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download PDFs from build matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          previous_tag=$(gh release list --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | map(select(.tagName | startswith("pdfs-"))) | .[0].tagName // ""')

          if [ -n "$previous_tag" ]; then
            gh release download "$previous_tag" --pattern '*.pdf' --dir release
          fi

          mkdir -p current
          gh run download "$GITHUB_RUN_ID" --dir current
          for artifact in current/*; do
            if [ -d "$artifact" ]; then
              cp -f "$artifact"/*.pdf release/
            fi
          done

      - name: Compare with latest PDF release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release list --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | map(select(.tagName | startswith("pdfs-"))) | .[0].tagName // ""')
          mkdir -p previous

          if [ -n "$previous_tag" ]; then
            gh release download "$previous_tag" --pattern '*.pdf' --dir previous
          fi

          changed=false
          for pdf in release/*.pdf; do
            name=${pdf##*/}
            if [ ! -f "previous/$name" ] || ! cmp -s "$pdf" "previous/$name"; then
              changed=true
              break
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Create PDF release
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pdfs-${GITHUB_RUN_ID}"
          gh release create "$tag" release/*.pdf \
            --target "$GITHUB_SHA" \
            --title "PDFs ${GITHUB_RUN_NUMBER}" \
            --notes "Generated from ${GITHUB_SHA}."
