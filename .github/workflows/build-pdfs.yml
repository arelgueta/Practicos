name: Build PDFs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add one entry for each document that should produce a PDF artifact.
        include:
          - tex_file: TP1/Practico1.tex
            pdf_file: TP1/Practico1.pdf
            artifact_name: Practico1-pdf

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile ${{ matrix.tex_file }}
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.tex_file }}

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.pdf_file }}
          if-no-files-found: error
